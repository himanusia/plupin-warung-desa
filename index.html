<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#2b1d12" />
		<title>Warung Desa</title>
	</head>
	<body>
		<main class="page">
			<header class="hud">
				<span class="chip">room <b data-testid="room">solo</b></span>
				<span class="chip">pemain <b data-testid="players">1</b></span>
				<span class="chip">waktu <b data-testid="time">90</b></span>
				<span class="chip">koin <b data-testid="coins">0</b></span>
				<span class="chip">dilayani <b data-testid="served">0</b></span>
			</header>

			<div class="field" data-testid="field">
				<canvas id="field" aria-label="Warung desa"></canvas>
				<section class="over" data-testid="over" hidden>
					<h1 data-testid="stars"></h1>
					<p data-testid="summary"></p>
					<ol class="board" data-testid="board"></ol>
					<button type="button" data-testid="buy" hidden>Celemek emas · Σ20</button>
					<button type="button" data-testid="again">Main lagi</button>
				</section>
			</div>

			<p class="hint" data-testid="hint">Ketuk bahan, ketuk wajan untuk goreng tempe, lalu ketuk pelanggan.</p>
		</main>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
